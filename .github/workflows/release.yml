name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      # Build with external flag to avoid react-devtools-core issue
      - name: Build ARM64 binary
        run: |
          bun build ./src/index.tsx --compile --outfile talos-darwin-arm64 --external react-devtools-core
          chmod +x talos-darwin-arm64
      
      - name: Build x64 binary
        run: |
          bun build ./src/index.tsx --compile --outfile talos-darwin-x64 --external react-devtools-core
          chmod +x talos-darwin-x64
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            talos-darwin-arm64
            talos-darwin-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
