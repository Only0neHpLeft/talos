name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Update version in source
        run: |
          echo 'export const VERSION = "${{ steps.get_version.outputs.VERSION }}";' > src/version.ts
      
      - name: Generate Release Notes
        id: generate_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          # Create formatted release notes
          cat > RELEASE_NOTES.md << 'EOF'
          ┌─────────────────────────────────────────────────────────────────┐
          │                        RELEASE v${VERSION}                        │
          └─────────────────────────────────────────────────────────────────┘
          
          EOF
          
          # Extract changelog section for this version
          if [ -f CHANGELOG.md ]; then
            # Find the section for this version
            awk "/^## \\[${VERSION}\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md >> RELEASE_NOTES.md
          fi
          
          # Add installation instructions
          cat >> RELEASE_NOTES.md << 'EOF'
          
          ┌─────────────────────────────────────────────────────────────────┐
          │                        INSTALLATION                             │
          └─────────────────────────────────────────────────────────────────┘
          
          Quick install:
            curl -fsSL https://raw.githubusercontent.com/Only0neHpLeft/talos/main/install.sh | bash
          
          Or download manually from the assets below.
          
          EOF
          
          # Set output for release step
          echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
      
      - name: Install dependencies
        run: bun install
      
      - name: Create stub for react-devtools-core
        run: |
          mkdir -p node_modules/react-devtools-core
          echo 'module.exports = {};' > node_modules/react-devtools-core/index.js
          echo '{"name":"react-devtools-core","main":"index.js"}' > node_modules/react-devtools-core/package.json
      
      - name: Build ARM64 binary
        run: |
          bun build ./src/index.tsx --compile --outfile talos-darwin-arm64
          chmod +x talos-darwin-arm64
      
      - name: Build x64 binary
        run: |
          bun build ./src/index.tsx --compile --outfile talos-darwin-x64
          chmod +x talos-darwin-x64
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            talos-darwin-arm64
            talos-darwin-x64
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
